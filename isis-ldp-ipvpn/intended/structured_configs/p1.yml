aaa_root:
  disabled: true
config_end: true
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet1
  description: P2P_pe1_Ethernet1
  shutdown: false
  mtu: 1500
  ip_address: 10.255.3.1/31
  ospf_network_point_to_point: true
  ospf_area: 0.0.0.0
  mpls:
    ip: true
    ldp:
      interface: true
      igp_sync: true
  metadata:
    peer: pe1
    peer_interface: Ethernet1
    peer_type: pe
  switchport:
    enabled: false
- name: Ethernet2
  description: P2P_pe2_Ethernet2
  shutdown: false
  mtu: 1500
  ip_address: 10.255.3.7/31
  ospf_network_point_to_point: true
  ospf_area: 0.0.0.0
  mpls:
    ip: true
    ldp:
      interface: true
      igp_sync: true
  metadata:
    peer: pe2
    peer_interface: Ethernet2
    peer_type: pe
  switchport:
    enabled: false
- name: Ethernet4
  description: P2P_p2_Ethernet4
  shutdown: false
  mtu: 1500
  ip_address: 10.255.3.8/31
  ospf_network_point_to_point: true
  ospf_area: 0.0.0.0
  mpls:
    ip: true
    ldp:
      interface: true
      igp_sync: true
  metadata:
    peer: p2
    peer_interface: Ethernet4
    peer_type: p
  switchport:
    enabled: false
- name: Ethernet3
  description: P2P_rr1_Ethernet3
  shutdown: false
  mtu: 1500
  ip_address: 10.255.3.11/31
  ospf_network_point_to_point: true
  ospf_area: 0.0.0.0
  mpls:
    ip: true
    ldp:
      interface: true
      igp_sync: true
  metadata:
    peer: rr1
    peer_interface: Ethernet3
    peer_type: rr
  switchport:
    enabled: false
hostname: p1
ip_routing: true
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 10.255.0.1/32
  ospf_area: 0.0.0.0
  mpls:
    ldp:
      interface: true
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 172.16.1.11/24
  type: oob
  gateway: 172.16.1.1
management_security:
  password:
    encryption_key_common: true
metadata:
  is_deployed: true
  platform: vEOS-lab
  fabric_name: FABRIC
  validate_hardware:
    enabled: false
mpls:
  ip: true
  ldp:
    interface_disabled_default: true
    router_id: 10.255.0.1
    shutdown: false
    transport_address_interface: Loopback0
router_ospf:
  process_ids:
  - id: 100
    passive_interface_default: true
    router_id: 10.255.0.1
    bfd_enable: false
    no_passive_interfaces:
    - Ethernet1
    - Ethernet2
    - Ethernet4
    - Ethernet3
    max_lsa: 12000
    graceful_restart:
      enabled: true
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: none
static_routes:
- vrf: MGMT
  prefix: 0.0.0.0/0
  next_hop: 172.16.1.1
transceiver_qsfp_default_mode_4x10: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vrfs:
- name: MGMT
  ip_routing: false
